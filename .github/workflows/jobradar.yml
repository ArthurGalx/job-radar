name: JobRadar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar JobRadar (um ciclo)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --once

      - name: Salvar vagas já vistas (evita notificação duplicada)
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"
          git add data/jobs.db
          git diff --cached --quiet || git commit -m "chore: atualiza vagas vistas [skip ci]"
          git push
