name: JobRadar

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: jobradar-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar JobRadar (um ciclo)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --once

      - name: Salvar vagas já vistas (evita notificação duplicada)
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"

          git add data/jobs.db
          if git diff --cached --quiet; then
            echo "Nada novo pra commitar."
            exit 0
          fi
          git commit -m "chore: atualiza vagas vistas [skip ci]"

          # Se outro push (execução concorrente, ou push manual) chegou
          # primeiro, o push abaixo é rejeitado. Em vez de falhar o run
          # (o que faria a vaga ser notificada de novo no próximo ciclo),
          # sincroniza e tenta de novo. data/jobs.db é binário (SQLite):
          # em caso de conflito, "-X ours" mantém a versão deste run
          # (base + vagas encontradas agora) — na pior hipótese, uma vaga
          # marcada só do outro lado é notificada mais uma vez, sem perda
          # real de dado.
          n=0
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "Push falhou depois de 5 tentativas."
              exit 1
            fi
            echo "Push rejeitado, sincronizando (tentativa $n)..."
            git fetch origin main
            git rebase origin/main -X ours || git rebase --abort
            sleep $((RANDOM % 5 + 1))
          done
